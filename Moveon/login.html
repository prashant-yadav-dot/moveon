<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MoveOn</title>
    <meta name="description" content="Login to MoveOn and continue your healing journey.">

    <link rel="icon" href="favicon.ico">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 10%, rgba(118,103,248,.14), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(255,170,205,.16), transparent 30%),
                #faf9ff;
            color: #26233a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .page {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7667f8, #a995ff);
            color: white;
            font-size: 30px;
            box-shadow: 0 12px 30px rgba(118,103,248,.25);
        }

        .brand h1 {
            margin-top: 13px;
            font-size: 29px;
            letter-spacing: -1px;
        }

        .brand p {
            margin-top: 6px;
            color: #77738a;
            font-size: 14px;
        }

        .card {
            background: rgba(255,255,255,.94);
            border: 1px solid rgba(118,103,248,.10);
            border-radius: 26px;
            padding: 30px 25px;
            box-shadow: 0 18px 55px rgba(61,50,110,.10);
        }

        .card h2 {
            font-size: 23px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #858194;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #4d485f;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #e5e1ef;
            border-radius: 14px;
            outline: none;
            padding: 0 15px;
            font-size: 15px;
            color: #28243b;
            background: #fcfbff;
            transition: .2s;
        }

        input:focus {
            border-color: #7667f8;
            box-shadow: 0 0 0 4px rgba(118,103,248,.10);
        }

        .password-input {
            padding-right: 48px;
        }

        .eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 3px 0 20px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #706b7e;
        }

        .remember input {
            width: 16px;
            height: 16px;
            accent-color: #7667f8;
        }

        .forgot {
            color: #6558e8;
            border: 0;
            background: none;
            cursor: pointer;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            height: 51px;
            border: 0;
            border-radius: 15px;
            background: linear-gradient(135deg, #7667f8, #6656e9);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(102,86,233,.22);
            transition: .2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 23px 0;
            color: #aaa5b7;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #ebe8f1;
        }

        .social-btn {
            width: 100%;
            height: 48px;
            border: 1px solid #e5e1ed;
            background: white;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #403b50;
            margin-bottom: 10px;
            transition: .2s;
        }

        .social-btn:hover {
            background: #faf9ff;
            border-color: #d7d1e8;
        }

        .signup {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #817c8d;
        }

        .signup a {
            color: #6656e9;
            text-decoration: none;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: #aaa5b5;
            font-size: 12px;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translate(-50%, 20px);
            background: #29263a;
            color: white;
            padding: 13px 18px;
            border-radius: 13px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 9999;
            max-width: 90%;
            text-align: center;
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 8px 0 0;
            color: #7667f8;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .card {
                padding: 25px 19px;
                border-radius: 22px;
            }

            .brand h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="brand">
        <div class="logo">🌱</div>
        <h1>MoveOn</h1>
        <p>Heal • Grow • Be You</p>
    </div>

    <div class="card">

        <h2>Welcome back 💜</h2>
        <p class="subtitle">
            Continue your healing journey.
        </p>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>

                <div class="input-wrap">
                    <input
                        id="password"
                        class="password-input"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        id="eye"
                        onclick="togglePassword()"
                    >👁</button>
                </div>
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox" id="remember" checked>
                    <span>Remember me</span>
                </label>

                <button
                    type="button"
                    class="forgot"
                    onclick="forgotPassword()"
                >
                    Forgot password?
                </button>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Log In →
            </button>

        </form>

        <div class="loading" id="loading">
            Checking your account...
        </div>

        <div class="divider">
            OR
        </div>

        <button
            type="button"
            class="social-btn"
            onclick="socialLogin('Google')"
        >
            Continue with Google
        </button>

        <button
            type="button"
            class="social-btn"
            onclick="appleLogin()"
        >
            Continue with Apple
        </button>

        <div class="signup">
            Don't have an account?
            <a href="signup.html">Create account</a>
        </div>

    </div>

    <div class="footer">
        Your healing space is private and personal. 🌱
    </div>

</div>

<div id="toast"></div>


<script type="module">

import {
    loginUser,
    redirectIfLoggedIn,
    redirectUser
} from "./auth.js";

import {
    sendPasswordResetEmail,
    GoogleAuthProvider,
    OAuthProvider,
    signInWithPopup,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import { auth } from "./firebase-config.js";


// ==========================================
// CHECK ALREADY LOGGED-IN USER
// ==========================================

redirectIfLoggedIn();


// ==========================================
// PASSWORD SHOW / HIDE
// ==========================================

window.togglePassword = function () {

    const password = document.getElementById("password");
    const eye = document.getElementById("eye");

    if (password.type === "password") {

        password.type = "text";
        eye.textContent = "🙈";

    } else {

        password.type = "password";
        eye.textContent = "👁";

    }

};


// ==========================================
// NORMAL EMAIL LOGIN
// ==========================================

document
.getElementById("loginForm")
.addEventListener("submit", async function (e) {

    e.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const remember =
        document.getElementById("remember")
        .checked;

    const loginBtn =
        document.getElementById("loginBtn");

    if (!email || !password) {

        showToast("Please fill all fields.");

        return;
    }


    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";


    try {

        // Remember Me setting
        await setPersistence(
            auth,
            remember
                ? browserLocalPersistence
                : browserSessionPersistence
        );


        const result =
            await loginUser(
                email,
                password
            );


        if (result.success) {

            showToast("Login successful! 💜");

            /*
             * IMPORTANT:
             * Do NOT directly send to home/onboarding.
             *
             * auth.js checks:
             *
             * profileCompleted === true
             *       → home.html
             *
             * profileCompleted === false
             *       → onboarding.html
             */

            setTimeout(async function () {

                await redirectUser();

            }, 700);


        } else {

            console.error(
                "Login failed:",
                result.error
            );

            let message =
                "Unable to login.";


            if (
                result.error &&
                result.error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "Email or password is incorrect.";

            } else if (
                result.error &&
                result.error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "No account found with this email.";

            } else if (
                result.error &&
                result.error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "Incorrect password.";

            } else if (
                result.error &&
                result.error.code ===
                "auth/too-many-requests"
            ) {

                message =
                    "Too many attempts. Try again later.";

            } else if (
                result.error &&
                result.error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "Please enter a valid email.";

            }


            showToast(message);

            loginBtn.disabled = false;
            loginBtn.textContent = "Log In →";

        }

    } catch (error) {

        console.error(
            "Login Error:",
            error
        );

        showToast(
            "Unable to login. Please try again."
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Log In →";

    }

});


// ==========================================
// FORGOT PASSWORD
// ==========================================

window.forgotPassword = async function () {

    const email =
        document.getElementById("email")
        .value
        .trim();


    if (!email) {

        showToast(
            "Enter your email first 📧"
        );

        document
            .getElementById("email")
            .focus();

        return;
    }


    try {

        await sendPasswordResetEmail(
            auth,
            email
        );

        showToast(
            "Password reset email sent 📧"
        );

    } catch (error) {

        console.error(
            "Password Reset Error:",
            error
        );

        let message =
            "Unable to send reset email.";


        if (
            error.code ===
            "auth/user-not-found"
        ) {

            message =
                "No account found with this email.";

        } else if (
            error.code ===
            "auth/invalid-email"
        ) {

            message =
                "Please enter a valid email.";

        }

        showToast(message);

    }

};


// ==========================================
// GOOGLE LOGIN
// ==========================================

window.socialLogin = async function (
    providerName
) {

    if (providerName !== "Google") {

        showToast(
            providerName +
            " login is not configured yet."
        );

        return;
    }


    try {

        const provider =
            new GoogleAuthProvider();


        await setPersistence(
            auth,
            browserLocalPersistence
        );


        const result =
            await signInWithPopup(
                auth,
                provider
            );


        /*
         * Google users may not have a
         * MoveOn database profile yet.
         *
         * auth.js routeUser() handles
         * that situation and sends them
         * to onboarding.
         */

        showToast(
            "Google login successful! 💜"
        );


        setTimeout(async function () {

            await redirectUser();

        }, 700);


    } catch (error) {

        console.error(
            "Google Login Error:",
            error
        );


        if (
            error.code ===
            "auth/popup-closed-by-user"
        ) {

            showToast(
                "Google login cancelled."
            );

        } else if (
            error.code ===
            "auth/popup-blocked"
        ) {

            showToast(
                "Please allow popups for Google login."
            );

        } else if (
            error.code ===
            "auth/account-exists-with-different-credential"
        ) {

            showToast(
                "This email already uses another login method."
            );

        } else {

            showToast(
                "Google login failed."
            );

        }

    }

};


// ==========================================
// APPLE LOGIN
// ==========================================

window.appleLogin = async function () {

    try {

        const provider =
            new OAuthProvider(
                "apple.com"
            );


        await setPersistence(
            auth,
            browserLocalPersistence
        );


        await signInWithPopup(
            auth,
            provider
        );


        showToast(
            "Apple login successful! 💜"
        );


        setTimeout(async function () {

            await redirectUser();

        }, 700);


    } catch (error) {

        console.error(
            "Apple Login Error:",
            error
        );


        if (
            error.code ===
            "auth/popup-closed-by-user"
        ) {

            showToast(
                "Apple login cancelled."
            );

        } else {

            showToast(
                "Apple login is not configured yet."
            );

        }

    }

};


// ==========================================
// TOAST
// ==========================================

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");


    setTimeout(function () {

        toast.classList.remove("show");

    }, 2800);

}

</script>


<script src="emoji-sounds.js"></script>

<script type="module" src="language.js"></script>
</body>
</html>
