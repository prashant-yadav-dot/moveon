<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MoveOn Premium</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{margin:0;font-family:Inter,Arial;background:linear-gradient(135deg,#f7f5ff,#fff);color:#202033;min-height:100vh;display:grid;place-items:center}.card{width:min(92%,430px);background:#fff;border-radius:26px;padding:28px;box-shadow:0 15px 45px #6c63ff18;text-align:center}.icon{font-size:48px}.price{font-size:38px;font-weight:800;color:#6c63ff}.muted{color:#777;line-height:1.5}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:#6c63ff;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.btn:disabled{opacity:.5}.status{margin-top:14px;font-size:13px;color:#666}</style></head><body><div class="card"><div class="icon">💜</div><h1>MoveOn Premium</h1><div class="price">₹49<span style="font-size:16px">/month</span></div><p class="muted">Unlock Ex Roleplay and premium healing features.</p><button class="btn" id="pay">Continue with ₹49/month</button><div class="status" id="status">Checking your account…</div></div><script type="module">import{auth}from"./firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";const API="/api/premium";const pay=document.getElementById("pay"),status=document.getElementById("status");let user=null;async function tok(){return user.getIdToken(true)}async function check(){try{const r=await fetch(`${API}/status`,{headers:{Authorization:`Bearer ${await tok()}`}});const d=await r.json().catch(()=>({}));if(d.active===true){status.textContent="Premium is active ✅";pay.textContent="Open Ex Roleplay";pay.onclick=()=>location.href="ex-roleplay.html";return true}status.textContent="Premium is not active yet.";return false}catch(e){status.textContent="Unable to check Premium status.";return false}}pay.onclick=async()=>{if(!user)return;pay.disabled=true;status.textContent="Creating secure subscription…";try{const t=await tok();const r=await fetch(`${API}/create-subscription`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${t}`},body:"{}"});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Unable to create subscription.");const options={key:d.keyId,subscription_id:d.subscriptionId,name:"MoveOn",description:"MoveOn Premium ₹49/month",handler:async response=>{status.textContent="Verifying payment…";const t2=await tok();const cr=await fetch(`${API}/confirm-subscription`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${t2}`},body:JSON.stringify({subscriptionId:d.subscriptionId,paymentId:response.razorpay_payment_id})});const cd=await cr.json().catch(()=>({}));if(!cr.ok)throw new Error(cd.error||"Payment verification failed.");status.textContent="Premium activated ✅";setTimeout(()=>location.href="ex-roleplay.html",500)},modal:{ondismiss:()=>{pay.disabled=false;status.textContent="Payment window closed."}}};new Razorpay(options).open()}catch(e){status.textContent=e?.message||"Payment failed.";pay.disabled=false}};onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html?redirect=premium.html";return}user=u;const active=await check();if(active)pay.textContent="Open Ex Roleplay"})</script></body></html>
