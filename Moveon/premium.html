<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MoveOn Premium</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f7f4ff,
          #fff7fb
        );

      color: #222;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;

      background: rgba(255,255,255,0.96);

      border-radius: 28px;

      padding: 32px 24px;

      box-shadow:
        0 20px 60px
        rgba(70,50,120,0.12);

      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;

      margin: 0 auto 18px;

      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #7667f8,
          #b47cff
        );

      color: white;

      font-size: 28px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #777;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .price {
      font-size: 44px;
      font-weight: 800;
      color: #5b4ed8;
    }

    .price span {
      font-size: 16px;
      font-weight: 500;
      color: #777;
    }

    .features {
      text-align: left;
      margin: 24px 0;
      padding: 0;
      list-style: none;
    }

    .features li {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .features li:last-child {
      border-bottom: 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;

      padding: 16px;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;

      color: white;

      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #8b5cf6
        );

      box-shadow:
        0 10px 25px
        rgba(108,99,255,0.25);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      min-height: 24px;

      font-size: 14px;
      color: #666;
    }

    .success {
      color: #178b4d;
      font-weight: 700;
    }

    .error {
      color: #d33;
      font-weight: 600;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: #6c63ff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="card">

    <div class="logo">
      M
    </div>

    <h1>MoveOn Premium</h1>

    <div class="subtitle">
      Heal better. Grow stronger. Move forward.
    </div>

    <div class="price">
      ₹49
      <span>/ month</span>
    </div>

    <ul class="features">
      <li>✓ Premium MoveOn features</li>
      <li>✓ Ex Roleplay access</li>
      <li>✓ Premium healing experience</li>
      <li>✓ Monthly subscription</li>
    </ul>

    <button
      id="premiumBtn"
      disabled
    >
      Checking Premium...
    </button>

    <div
      id="status"
      class="status"
    ></div>

    <a
      href="home.html"
      class="back"
    >
      ← Back to MoveOn
    </a>

  </div>

</div>


<script type="module">

import {
  auth
} from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const API_BASE =
  "https://moveon.shanydv001.workers.dev";


const button =
  document.getElementById("premiumBtn");

const statusEl =
  document.getElementById("status");


let currentUser = null;


/* =========================
   HELPERS
========================= */

function setStatus(
  message,
  type = ""
) {
  statusEl.textContent =
    message;

  statusEl.className =
    "status " + type;
}


async function getToken() {

  if (!currentUser) {
    throw new Error(
      "Please login first."
    );
  }

  return await currentUser.getIdToken(
    true
  );
}


async function api(
  path,
  options = {}
) {

  const token =
    await getToken();

  const response =
    await fetch(
      API_BASE + path,
      {
        ...options,

        headers: {
          "Content-Type":
            "application/json",

          "Authorization":
            `Bearer ${token}`,

          ...(options.headers || {})
        }
      }
    );

  let data = {};

  try {
    data =
      await response.json();
  } catch {}

  if (!response.ok) {

    const error =
      data.error ||
      `Request failed (${response.status})`;

    const err =
      new Error(error);

    err.status =
      response.status;

    err.data =
      data;

    throw err;
  }

  return data;
}


/* =========================
   CHECK EXISTING PREMIUM
========================= */

async function checkPremium() {

  try {

    setStatus(
      "Checking your subscription..."
    );

    const data =
      await api(
        "/api/premium/status",
        {
          method: "GET"
        }
      );

    if (
      data.active === true
    ) {

      setStatus(
        "✓ Premium is already active.",
        "success"
      );

      button.disabled = false;

      button.textContent =
        "Open MoveOn";

      button.onclick =
        () => {
          window.location.href =
            "home.html";
        };

      return true;
    }

    /*
      No active subscription found.
    */

    button.disabled =
      false;

    button.textContent =
      "Start Premium — ₹49/month";

    setStatus(
      "Premium is not active yet."
    );

    button.onclick =
      startPremium;

    return false;

  } catch (error) {

    console.error(
      "Premium status error:",
      error
    );

    /*
      Even if status endpoint fails,
      allow checkout.
    */

    button.disabled =
      false;

    button.textContent =
      "Start Premium — ₹49/month";

    setStatus(
      "Ready to continue."
    );

    button.onclick =
      startPremium;

    return false;
  }
}


/* =========================
   START PREMIUM
========================= */

async function startPremium() {

  button.disabled =
    true;

  button.textContent =
    "Checking...";

  setStatus(
    "Checking for an existing subscription..."
  );

  /*
    IMPORTANT:
    This first checks whether the user already
    has an ACTIVE Razorpay subscription.

    This prevents another ₹49 subscription
    from being created.
  */

  try {

    const existing =
      await api(
        "/api/premium/status",
        {
          method: "GET"
        }
      );

    if (
      existing.active === true
    ) {

      setStatus(
        "✓ Your existing Premium subscription is active.",
        "success"
      );

      button.textContent =
        "Open MoveOn";

      button.disabled =
        false;

      button.onclick =
        () => {
          window.location.href =
            "home.html";
        };

      return;
    }

  } catch (error) {

    console.warn(
      "Existing subscription check failed:",
      error
    );
  }


  /* =========================
     CREATE RAZORPAY SUBSCRIPTION
  ========================= */

  button.textContent =
    "Opening Razorpay...";

  setStatus(
    "Please complete the payment in Razorpay."
  );

  try {

    const result =
      await api(
        "/api/premium/create-subscription",
        {
          method: "POST"
        }
      );

    /*
      If Worker found an already active
      subscription, don't open checkout.
    */

    if (
      result.alreadyActive === true
    ) {

      setStatus(
        "✓ Premium activated from your existing subscription.",
        "success"
      );

      button.textContent =
        "Open MoveOn";

      button.disabled =
        false;

      button.onclick =
        () => {
          window.location.href =
            "home.html";
        };

      return;
    }


    const subscription =
      result.subscription;


    if (
      !subscription ||
      !subscription.id
    ) {
      throw new Error(
        "Razorpay subscription was not created."
      );
    }


    const options = {

      key:
        "rzp_live_Tj4noldihrkqS4",

      subscription_id:
        subscription.id,

      name:
        "MoveOn",

      description:
        "MoveOn Premium ₹49/month",

      image:
        "https://moveon.shanydv001.workers.dev/favicon.ico",

      handler:
        async function(response) {

          await handlePaymentSuccess(
            response
          );
        },

      modal: {
        ondismiss:
          function() {

            button.disabled =
              false;

            button.textContent =
              "Start Premium — ₹49/month";

            setStatus(
              "Payment window closed."
            );
          }
      },

      theme: {
        color:
          "#6c63ff"
      }

    };


    const razorpay =
      new Razorpay(
        options
      );


    razorpay.on(
      "payment.failed",
      function(response) {

        console.error(
          "Razorpay payment failed:",
          response
        );

        button.disabled =
          false;

        button.textContent =
          "Try Again";

        setStatus(
          response.error?.description ||
          "Payment failed.",
          "error"
        );
      }
    );


    razorpay.open();


  } catch (error) {

    console.error(
      "Premium start error:",
      error
    );

    button.disabled =
      false;

    button.textContent =
      "Start Premium — ₹49/month";

    setStatus(
      error.message ||
      "Unable to start Premium.",
      "error"
    );
  }
}


/* =========================
   PAYMENT SUCCESS
========================= */

async function handlePaymentSuccess(
  response
) {

  button.disabled =
    true;

  button.textContent =
    "Activating Premium...";

  setStatus(
    "Payment received. Activating your Premium..."
  );


  const subscriptionId =
    response.razorpay_subscription_id;


  /*
    Send the subscription ID returned
    by Razorpay to our Worker.
  */

  try {

    const result =
      await api(
        "/api/premium/confirm-subscription",
        {
          method: "POST",

          body:
            JSON.stringify({
              subscriptionId
            })
        }
      );


    if (
      result.active === true
    ) {

      setStatus(
        "✓ Premium activated successfully!",
        "success"
      );

      button.textContent =
        "Open MoveOn";

      button.disabled =
        false;

      button.onclick =
        () => {
          window.location.href =
            "home.html";
        };

      return;
    }


  } catch (error) {

    console.warn(
      "Initial confirmation:",
      error
    );
  }


  /*
    If Razorpay activation is asynchronous,
    try the status/sync endpoint again.
  */

  for (
    let attempt = 1;
    attempt <= 5;
    attempt++
  ) {

    try {

      setStatus(
        `Activating Premium... (${attempt}/5)`
      );

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            2500
          )
      );


      const sync =
        await api(
          "/api/premium/status",
          {
            method: "GET"
          }
        );


      if (
        sync.active === true
      ) {

        setStatus(
          "✓ Premium activated successfully!",
          "success"
        );

        button.textContent =
          "Open MoveOn";

        button.disabled =
          false;

        button.onclick =
          () => {
            window.location.href =
              "home.html";
          };

        return;
      }

    } catch (error) {

      console.warn(
        "Activation attempt failed:",
        error
      );
    }
  }


  /*
    If webhook/API is still processing.
  */

  button.disabled =
    false;

  button.textContent =
    "Check Premium Again";

  setStatus(
    "Payment completed. Premium activation is still processing."
  );

  button.onclick =
    checkPremium;
}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      currentUser =
        null;

      button.disabled =
        false;

      button.textContent =
        "Login to Continue";

      setStatus(
        "Please login to use MoveOn Premium.",
        "error"
      );

      button.onclick =
        () => {
          window.location.href =
            "login.html?redirect=premium.html";
        };

      return;
    }


    currentUser =
      user;


    await checkPremium();

  }
);

</script>

</body>
</html>
