<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#6c63ff">
<title>Ex Roleplay — MoveOn</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:linear-gradient(135deg,#f7f5ff,#fff);
  color:#202033;
  min-height:100vh;
}

.wrap{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.top{
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #eceaf5;
  background:rgba(255,255,255,.9);
  position:sticky;
  top:0;
  z-index:5;
}

.back,
.settings{
  border:0;
  background:#f0eefb;
  border-radius:12px;
  padding:10px 13px;
  font-size:18px;
  cursor:pointer;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#6c63ff,#a98cff);
  color:white;
  font-size:19px;
}

.title{
  flex:1;
}

.title strong{
  display:block;
  font-size:17px;
}

.title span{
  font-size:12px;
  color:#777;
}

.chat{
  flex:1;
  padding:22px 16px 120px;
  overflow-y:auto;
}

.notice{
  font-size:12px;
  color:#777;
  text-align:center;
  margin:4px auto 18px;
  max-width:600px;
  line-height:1.5;
}

.bubble{
  max-width:78%;
  padding:12px 15px;
  border-radius:18px;
  margin:10px 0;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
}

.ai{
  background:white;
  border:1px solid #eceaf5;
  border-bottom-left-radius:5px;
  box-shadow:0 4px 18px rgba(50,40,100,.05);
}

.user{
  margin-left:auto;
  background:#6c63ff;
  color:white;
  border-bottom-right-radius:5px;
}

.typing{
  display:none;
  color:#777;
  font-size:13px;
  margin:10px 0;
}

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.95);
  border-top:1px solid #eceaf5;
  padding:12px 16px;
}

.composer-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:8px;
}

.composer input{
  flex:1;
  border:1px solid #ddd9ee;
  border-radius:16px;
  padding:13px 15px;
  font-size:15px;
  outline:none;
}

.send{
  border:0;
  background:#6c63ff;
  color:white;
  border-radius:15px;
  padding:0 18px;
  font-weight:700;
  cursor:pointer;
}

.send:disabled{
  opacity:.5;
}

.empty{
  opacity:.75;
  text-align:center;
  margin-top:25vh;
}

.quick{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
  justify-content:center;
}

.quick button{
  border:1px solid #ddd9ee;
  background:#fff;
  border-radius:20px;
  padding:8px 11px;
  color:#4b4660;
  cursor:pointer;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(20,16,40,.45);
  z-index:20;
  padding:20px;
}

.panel{
  max-width:440px;
  margin:10vh auto;
  background:white;
  border-radius:22px;
  padding:22px;
}

.panel input{
  width:100%;
  padding:13px;
  border:1px solid #ddd9ee;
  border-radius:12px;
  margin:8px 0 14px;
  font-size:15px;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:12px;
  cursor:pointer;
}

.save{
  background:#6c63ff;
  color:white;
}

.cancel{
  background:#eeeaf7;
}

.error{
  color:#c33;
  text-align:center;
  margin:20px;
}
</style>
</head>

<body>

<div class="wrap">

<header class="top">

<button class="back" onclick="history.back()">←</button>

<div class="avatar">💬</div>

<div class="title">
<strong id="screenTitle">Ex Roleplay</strong>
<span>Talk. Feel. Let it out.</span>
</div>

<button class="settings" onclick="openSettings()">⚙️</button>

</header>

<main class="chat" id="chat">

<div class="notice">
Ex Roleplay is a fictional AI simulation, not your real ex.
Use it as a space for reflection and closure.
</div>

<div class="empty" id="empty">

<div style="font-size:42px">💜</div>

<h3>What do you want to say?</h3>

<p style="color:#777">
You can start the conversation whenever you're ready.
</p>

<div class="quick">

<button onclick="quickSend('I miss you.')">
I miss you.
</button>

<button onclick="quickSend('I still have so many questions.')">
I have questions.
</button>

<button onclick="quickSend('I want closure.')">
I want closure.
</button>

</div>

</div>

<div class="typing" id="typing">
Typing…
</div>

</main>

<div class="composer">

<div class="composer-inner">

<input
id="message"
maxlength="2000"
placeholder="Message your Ex Roleplay…"
autocomplete="off">

<button
class="send"
id="send"
onclick="sendMessage()">

Send

</button>

</div>

</div>

</div>


<div class="modal" id="settingsModal">

<div class="panel">

<h2>Ex Roleplay</h2>

<p style="color:#777;font-size:14px">
Give the fictional character a name.
</p>

<label>Ex's name</label>

<input
id="exName"
maxlength="40"
placeholder="e.g. Aisha">

<div class="actions">

<button
class="cancel"
onclick="closeSettings()">

Cancel

</button>

<button
class="save"
onclick="saveSettings()">

Save

</button>

</div>

</div>

</div>


<script type="module">

import { auth } from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const API_URL =
  "/api/ex-roleplay";


const PREMIUM_URL =
  "/api/premium/status";


const NAME_KEY =
  "moveon_ex_roleplay_name";


const CHAT_KEY =
  "moveon_ex_roleplay_chat";


const chat =
  document.getElementById("chat");


const input =
  document.getElementById("message");


const send =
  document.getElementById("send");


const typing =
  document.getElementById("typing");


const empty =
  document.getElementById("empty");


let currentUser = null;

let exName =
  localStorage.getItem(NAME_KEY)
  || "Ex Roleplay";


let historyData = [];


try {

  const saved =
    JSON.parse(
      localStorage.getItem(CHAT_KEY)
      || "[]"
    );

  historyData =
    Array.isArray(saved)
      ? saved.slice(-60)
      : [];

} catch {

  historyData = [];

}


/* =========================
   SAVE CHAT
========================= */

function saveChat(){

  localStorage.setItem(
    CHAT_KEY,
    JSON.stringify(
      historyData.slice(-60)
    )
  );

}


/* =========================
   ADD MESSAGE
========================= */

function addBubble(
  role,
  text,
  save = true
){

  const d =
    document.createElement("div");

  d.className =
    "bubble " +
    (role === "user"
      ? "user"
      : "ai");

  d.textContent =
    String(text || "");

  chat.insertBefore(
    d,
    typing
  );

  if(save){

    historyData.push({
      role,
      content:
        String(text || "")
    });

    saveChat();

  }

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   RENDER
========================= */

function render(){

  document.getElementById(
    "screenTitle"
  ).textContent =
    exName || "Ex Roleplay";


  empty.style.display =
    historyData.length
      ? "none"
      : "block";


  historyData.forEach(
    item => {

      if(item?.content){

        addBubble(
          item.role === "user"
            ? "user"
            : "assistant",

          item.content,

          false
        );

      }

    }
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   GET FIREBASE TOKEN
========================= */

async function getToken(){

  if(!currentUser){

    throw new Error(
      "Please login first."
    );

  }

  return await currentUser.getIdToken(
    true
  );

}


/* =========================
   CHECK PREMIUM
========================= */

async function checkPremium(){

  try{

    const token =
      await getToken();


    const response =
      await fetch(
        PREMIUM_URL,
        {
          method:"GET",

          headers:{
            "Authorization":
              `Bearer ${token}`
          }
        }
      );


    const data =
      await response.json()
        .catch(() => ({}));


    if(
      !response.ok ||
      data.active !== true
    ){

      alert(
        "MoveOn Premium is required for Ex Roleplay."
      );

      window.location.href =
        "premium.html";

      return false;

    }


    return true;

  }catch(error){

    console.error(
      "Premium check error:",
      error
    );

    alert(
      "Unable to verify Premium. Please try again."
    );

    window.location.href =
      "premium.html";

    return false;

  }

}


/* =========================
   SETTINGS
========================= */

window.openSettings =
function(){

  document.getElementById(
    "exName"
  ).value =
    exName === "Ex Roleplay"
      ? ""
      : exName;


  document.getElementById(
    "settingsModal"
  ).style.display =
    "block";

};


window.closeSettings =
function(){

  document.getElementById(
    "settingsModal"
  ).style.display =
    "none";

};


window.saveSettings =
function(){

  const value =
    document.getElementById(
      "exName"
    ).value
      .trim()
      .slice(0,40);


  exName =
    value || "Ex Roleplay";


  localStorage.setItem(
    NAME_KEY,
    exName
  );


  document.getElementById(
    "screenTitle"
  ).textContent =
    exName;


  closeSettings();

};


/* =========================
   QUICK SEND
========================= */

window.quickSend =
function(text){

  input.value =
    text;

  sendMessage();

};


/* =========================
   SEND MESSAGE
========================= */

window.sendMessage =
async function(){

  const text =
    input.value.trim();


  if(
    !text ||
    send.disabled
  ){

    return;

  }


  /*
    Check Premium again before sending.
  */

  const premium =
    await checkPremium();


  if(!premium){

    return;

  }


  addBubble(
    "user",
    text
  );


  input.value =
    "";


  empty.style.display =
    "none";


  send.disabled =
    true;


  typing.style.display =
    "block";


  chat.scrollTop =
    chat.scrollHeight;


  try{

    const token =
      await getToken();


    const requestHistory =
      historyData
        .slice(-16)
        .filter(
          x =>
            x &&
            (
              x.role === "user" ||
              x.role === "assistant"
            ) &&
            x.content
        )
        .slice(0,16);


    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${token}`
          },

          body:
            JSON.stringify({

              exName,

              message:text,

              history:
                requestHistory

            })
        }
      );


    const raw =
      await response.text();


    let data = {};

    try{

      data =
        raw
          ? JSON.parse(raw)
          : {};

    }catch{}


    if(!response.ok){

      throw new Error(
        data?.error ||
        `Server error (${response.status})`
      );

    }


    if(!data?.reply){

      throw new Error(
        "AI returned an empty reply."
      );

    }


    addBubble(
      "assistant",
      data.reply
    );


  }catch(error){

    console.error(
      "MoveOn Ex Roleplay error:",
      error
    );


    addBubble(
      "assistant",
      "⚠️ " +
      (
        error?.message ||
        "Unable to reply right now."
      )
    );


  }finally{

    typing.style.display =
      "none";

    send.disabled =
      false;

    input.focus();

  }

};


/* =========================
   CLEAR CHAT
========================= */

window.clearChat =
function(){

  if(!historyData.length)
    return;


  if(
    !confirm(
      "Clear this roleplay conversation?"
    )
  ){

    return;

  }


  historyData = [];

  saveChat();


  chat
    .querySelectorAll(".bubble")
    .forEach(
      el => el.remove()
    );


  empty.style.display =
    "block";

};


/* =========================
   ENTER TO SEND
========================= */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   AUTH + PREMIUM
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "login.html?redirect=ex-roleplay.html";

      return;

    }


    currentUser =
      user;


    /*
      IMPORTANT:
      Don't open Ex Roleplay unless
      Premium is confirmed.
    */

    const premium =
      await checkPremium();


    if(!premium)
      return;


    render();

  }
);

</script>

</body>
</html>
